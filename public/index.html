<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mini Social (demo)</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
  <span class="logo">LR</span>
  <h1>LOS ROLONES</h1>
      </div>
      <div class="user-area" id="userArea">
        <!-- login/register links or user info will be injected -->
      </div>
    </header>

    <main>
      <section id="composer">
        <textarea id="content" placeholder="\u00bfQu\u00e9 est\u00e1s pensando?\"></textarea>
        <button id="postBtn">Publicar</button>
        <div id="adminArea" class="admin-area">
          <button id="cleanupBtn" class="danger">Limpiar uploads no referenciados</button>
          <span id="cleanupResult" class="cleanup-result"></span>
        </div>
      </section>
      <section id="feed"></section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
