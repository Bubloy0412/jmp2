<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cambiar contraseña</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="shortcut icon" href="/favicon.ico">
</head>
<body>
  <main>
    <h2>Cambiar contraseña</h2>
    <form id="pwForm">
      <div>
        <label for="currentPassword">Contraseña actual (si aplica)</label>
        <input type="password" id="currentPassword" placeholder="Contraseña actual" title="Contraseña actual">
      </div>
      <div>
        <label for="newPassword">Nueva contraseña</label>
        <input type="password" id="newPassword" placeholder="Nueva contraseña" title="Nueva contraseña">
      </div>
      <button type="submit">Cambiar</button>
    </form>
    <div id="msg"></div>
  </main>
  <script>
    document.getElementById('pwForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const current = document.getElementById('currentPassword').value;
      const nw = document.getElementById('newPassword').value;
      try{
        const res = await fetch('/api/me/change-password', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({currentPassword: current || undefined, newPassword: nw}), credentials: 'same-origin'});
        const txt = await res.text();
        if (!res.ok) throw new Error(txt || res.statusText);
        document.getElementById('msg').textContent = 'Contraseña cambiada. Recargando...';
        setTimeout(()=> location.href = '/', 1000);
      }catch(e){ document.getElementById('msg').textContent = 'Error: ' + e.message; }
    });
  </script>
</body>
</html>
